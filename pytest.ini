[tool:pytest]
# Test discovery and execution
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Async testing configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --showlocals
    --tb=long

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require services like Redis, PostgreSQL)
    e2e: End-to-end tests (full system testing)
    slow: Slow tests (may take >5 seconds)
    api: Tests that make external API calls (requires mocking in CI)
    database: Tests that use the database
    redis: Tests that use Redis
    nats: Tests that use NATS
    gsc: Google Search Console integration tests  
    ga4: Google Analytics 4 integration tests
    serpapi: SerpAPI integration tests
    agents: Agent workflow tests
    queue: Task queue tests
    notifications: Notification system tests
    auth: Authentication and authorization tests
    rate_limit: Rate limiting tests
    retry: Retry mechanism tests
    circuit_breaker: Circuit breaker tests
    
# Test environment variables
env = 
    ENVIRONMENT=testing
    DEBUG=true
    LOG_LEVEL=DEBUG
    POSTGRES_HOST=localhost
    POSTGRES_PORT=5432
    POSTGRES_DB=seo_platform_test
    POSTGRES_USER=test
    POSTGRES_PASSWORD=testpassword123
    REDIS_HOST=localhost
    REDIS_PORT=6379
    REDIS_DB=15
    NATS_HOST=localhost
    NATS_PORT=4222
    
# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*urllib3.*:DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (when using pytest-cov)
[coverage:run]
source = .
omit = 
    */tests/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */venv/*
    */env/*
    .venv/*
    setup.py
    */site-packages/*
    
branch = true
parallel = true

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

show_missing = true
skip_covered = false
precision = 2
sort = Cover

[coverage:html]
directory = htmlcov
title = SEO Automation Platform Test Coverage

[coverage:xml]
output = coverage.xml
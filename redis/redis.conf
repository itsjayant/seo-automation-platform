# Redis configuration for SEO Automation Platform
# Optimized for task queue operations using Redis Streams

# Basic configuration
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings - balanced for task queue reliability
# AOF (Append Only File) for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots for backup
save 900 1
save 300 10  
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Logging
loglevel notice
logfile ""

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Streams configuration
# Enable streams and set reasonable limits for task queues
# SEO platform will use 'seo:tasks' stream
stream-node-max-bytes 4096
stream-node-max-entries 100

# Security (basic - will be enhanced with AUTH in production)
protected-mode no
# requirepass will be set via environment variable in production

# Performance tuning
databases 1
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100
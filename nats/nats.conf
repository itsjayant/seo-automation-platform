# NATS Server Configuration for SEO Automation Platform
# Configured with JetStream for durable approval workflows

# Server settings
port: 4222
http_port: 8222
server_name: seo_nats

# Logging
log_file: "/data/nats.log"
logtime: true
debug: false
trace: false
log_size_limit: 50MB

# Connection settings
max_connections: 1000
max_control_line: 4096
max_payload: 1MB
max_pending: 64MB
write_deadline: "10s"
ping_interval: "2m"
ping_max: 2

# JetStream configuration for approval workflows
jetstream {
    # Storage directory (mounted as volume)
    store_dir: "/data"
    
    # Global limits for JetStream
    max_memory_store: 256MB
    max_file_store: 1GB
    
    # Domain (optional, for federation)
    # domain: "seo-platform"
}

# Authorization (basic setup - no auth in development)
# In production, this should be enhanced with proper authentication
authorization {
    default_permissions: {
        publish: {
            allow: ["approvals.>", "alerts.>", "tasks.>"]
        }
        subscribe: {
            allow: ["approvals.>", "alerts.>", "tasks.>"]
        }
    }
}

# Monitoring endpoint for health checks
http: "0.0.0.0:8222"


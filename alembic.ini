# Alembic configuration for SEO Automation Platform
# Database migrations with TimescaleDB and pgvector support

[alembic]
# path to migration scripts
script_location = db/migrations

# template used to generate migration file names with date/time prefix
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone used for migration file timestamps
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during revision command for autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without source .py file
sourceless = false

# version locations - defaults to db/migrations/versions
# version_locations = %(here)s/bar:%(here)s/bat:db/migrations/versions

# version path separator
version_path_separator = os  # Use os.pathsep

# set to 'true' to search source files recursively in version_locations
recursive_version_locations = false

# output encoding for revision files
output_encoding = utf-8

# Database URL will be set dynamically from Pydantic configuration
# This placeholder is overridden in env.py
sqlalchemy.url = postgresql://placeholder


[post_write_hooks]
# Format migration files using Black for consistent code style
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 88 REVISION_SCRIPT_FILENAME

# Lint with Ruff for code quality
ruff.type = exec
ruff.executable = ruff
ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration for Alembic operations
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
